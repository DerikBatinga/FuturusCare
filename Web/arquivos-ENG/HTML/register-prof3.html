  <title>Professional Registration - Password</title>

<body>

  <div class="container">
    <div class="left-side"></div>

    <div class="right-side">
      <div class="form-container">
        <h2>Create your password</h2>
        <form action="profile.html" method="GET">
          <label for="senha">Password</label>
          <input id="senha" class="form-button" type="password" placeholder="Enter your password" required>

          <label for="confirma-senha">Confirm Password</label>
          <input id="confirma-senha" class="form-button" type="password" placeholder="Confirm your password" required>

          <button class="submit-button" type="submit">Continue</button>
        </form>
      </div>
    </div>
  </div>

</body>
